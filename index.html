<meta charset="utf-8">
<title>Sawatdee</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=K2D:wght@600;700;800&family=Sarabun:wght@400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F2F5F1; --surface:#FFFFFF; --surface2:#E9EFE8; --ink:#22302B; --ink2:#5F6F67;
  --line:#DCE4DB; --accent:#D98E1B; --accent-deep:#B36F07; --accent-ink:#3A2704;
  --accent-soft:#F6ECD6; --hero1:#E9A63A; --hero2:#C97B10;
  --good:#3E8E5A; --good-soft:#E2F0E6; --bad:#C4574E; --bad-soft:#F8E4E1;
  --chip:#E9EFE8; --shadow:0 6px 24px rgba(34,48,43,.08);
  --font-d:'K2D','Sarabun',system-ui,sans-serif;
  --font-ui:'Sarabun',system-ui,sans-serif;
  --font-w:'Noto Sans','Noto Sans Thai',system-ui,sans-serif;
  --font-th:'Noto Sans Thai','Noto Sans',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141B18; --surface:#1D2622; --surface2:#26302B; --ink:#E7EDE8; --ink2:#96A69D;
    --line:#2E3A34; --accent:#E9A94B; --accent-deep:#F0BC6C; --accent-ink:#2A1D03;
    --accent-soft:#382C14; --hero1:#D9962B; --hero2:#A8650B;
    --good:#5FB380; --good-soft:#20342A; --bad:#DD7A6F; --bad-soft:#3D2523;
    --chip:#26302B; --shadow:0 6px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#141B18; --surface:#1D2622; --surface2:#26302B; --ink:#E7EDE8; --ink2:#96A69D;
  --line:#2E3A34; --accent:#E9A94B; --accent-deep:#F0BC6C; --accent-ink:#2A1D03;
  --accent-soft:#382C14; --hero1:#D9962B; --hero2:#A8650B;
  --good:#5FB380; --good-soft:#20342A; --bad:#DD7A6F; --bad-soft:#3D2523;
  --chip:#26302B; --shadow:0 6px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--ink); font-family:var(--font-ui); font-size:16px; line-height:1.5;}
button{font-family:inherit; color:inherit; border:none; background:none; cursor:pointer; padding:0}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:6px}
input,select{font-family:inherit; font-size:1rem; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:.65rem .8rem; width:100%}
textarea{font-family:monospace; font-size:.8rem; color:var(--ink); background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:.65rem .8rem; width:100%; min-height:7rem}
h1,h2,h3{font-family:var(--font-d); line-height:1.15; margin:0; text-wrap:balance}
.app{max-width:30rem; margin:0 auto; min-height:100vh; min-height:100dvh; display:flex; flex-direction:column}
.view{flex:1; padding:1.1rem 1.1rem 6rem; display:flex; flex-direction:column; gap:1rem}
.fullview{flex:1; padding:1rem 1.1rem 1.5rem; display:flex; flex-direction:column; gap:1rem}

/* top bar */
.topbar{display:flex; align-items:baseline; justify-content:space-between; gap:.75rem; padding:.4rem 0 .1rem}
.brand{font-family:var(--font-d); font-weight:800; font-size:1.25rem; letter-spacing:.01em}
.brand .th{font-family:var(--font-th); font-weight:600; color:var(--accent); margin-right:.35rem}
.streakchip{font-size:.8rem; font-weight:700; background:var(--chip); border-radius:999px; padding:.25rem .7rem; color:var(--ink2)}
.streakchip.hot{background:var(--accent-soft); color:var(--accent-deep)}

/* hero */
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2)); color:var(--accent-ink); border-radius:20px; padding:1.25rem 1.25rem 1.35rem; position:relative; overflow:hidden; box-shadow:var(--shadow)}
.hero .mark{position:absolute; right:-.4rem; top:-2.4rem; font-family:var(--font-th); font-size:9rem; line-height:1; opacity:.14; pointer-events:none; user-select:none}
.hero .kicker{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.14em; opacity:.75}
.hero h1{font-size:2rem; font-weight:800; margin:.15rem 0 .1rem}
.hero .sub{font-size:.9rem; font-weight:600; opacity:.85; margin-bottom:1rem}
.bigbtn{display:block; width:100%; text-align:center; background:var(--accent-ink); color:#F6E9CF; font-family:var(--font-d); font-weight:700; font-size:1.05rem; padding:.85rem 1rem; border-radius:14px; transition:transform .1s}
.bigbtn:active{transform:scale(.98)}
.hero .counts{display:flex; gap:1rem; margin-top:.7rem; font-size:.82rem; font-weight:600; opacity:.85}

/* cards & sections */
.card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:1rem 1.1rem}
.sectionlabel{font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.14em; color:var(--ink2); margin:.4rem 0 -.3rem}
.progressbar{height:8px; background:var(--surface2); border-radius:99px; overflow:hidden}
.progressbar i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .4s}
.pacenote{font-size:.82rem; color:var(--ink2); margin-top:.45rem}
.pacenote b{color:var(--good)}
.pacenote b.behind{color:var(--accent-deep)}

/* unit rows */
.unitrow{display:flex; align-items:center; gap:.9rem; width:100%; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:.8rem .95rem}
.unitrow.active{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent)}
.unitrow .thglyph{font-family:var(--font-th); font-size:1.5rem; color:var(--accent); width:2.4rem; flex-shrink:0; text-align:center}
.unitrow .uinfo{flex:1; min-width:0}
.unitrow .uname{font-weight:700; font-size:.95rem}
.unitrow .usub{font-size:.78rem; color:var(--ink2)}
.unitrow .uprog{font-size:.78rem; font-weight:700; color:var(--ink2); font-variant-numeric:tabular-nums; flex-shrink:0}
.unitrow .uprog.done{color:var(--good)}
.dlgchip{display:inline-block; font-size:.72rem; font-weight:700; background:var(--accent-soft); color:var(--accent-deep); border-radius:999px; padding:.1rem .55rem; margin-top:.15rem}
.dlgchip.done{background:var(--good-soft); color:var(--good)}

/* bottom nav */
.nav{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); display:flex; justify-content:center; z-index:20; padding-bottom:env(safe-area-inset-bottom)}
.nav .inner{display:flex; width:100%; max-width:30rem}
.nav button{flex:1; display:flex; flex-direction:column; align-items:center; gap:.15rem; padding:.55rem 0 .6rem; font-size:.68rem; font-weight:700; color:var(--ink2)}
.nav button.on{color:var(--accent-deep)}
.nav svg{width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

/* session */
.sesstop{display:flex; align-items:center; gap:.8rem}
.sesstop .x{font-size:1.5rem; color:var(--ink2); padding:.2rem .5rem}
.sesstop .progressbar{flex:1}
.exwrap{flex:1; display:flex; flex-direction:column; gap:1rem; justify-content:flex-start; padding-top:.5rem}
.exprompt{font-size:.8rem; font-weight:700; text-transform:uppercase; letter-spacing:.12em; color:var(--ink2)}
.exq{font-family:var(--font-d); font-size:1.35rem; font-weight:700; line-height:1.3}
.exq .th{font-family:var(--font-th); font-weight:500}
.opts{display:flex; flex-direction:column; gap:.6rem}
.opt{display:block; width:100%; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:.75rem .95rem; font-size:1rem; transition:border-color .12s}
.opt .rom{font-family:var(--font-w); font-weight:600; font-size:1.02rem}
.opt .sub{font-size:.8rem; color:var(--ink2); font-family:var(--font-th)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--good); background:var(--good-soft)}
.opt.wrong{border-color:var(--bad); background:var(--bad-soft)}
.opt:disabled{cursor:default}
.audiobtns{display:flex; gap:.6rem}
.audiobtn{display:flex; align-items:center; gap:.45rem; background:var(--accent-soft); color:var(--accent-deep); font-weight:700; font-size:.9rem; border-radius:999px; padding:.55rem 1.05rem}
.audiobtn svg{width:18px; height:18px; fill:currentColor}
.audiobtn.big{font-size:1rem; padding:.7rem 1.3rem}
.feedback{border-radius:14px; padding:.8rem 1rem; font-weight:600; font-size:.95rem}
.feedback.good{background:var(--good-soft); color:var(--good)}
.feedback.bad{background:var(--bad-soft); color:var(--bad)}
.feedback .fbrom{font-family:var(--font-w)}
.checkbtn{display:block; width:100%; text-align:center; background:var(--accent); color:var(--accent-ink); font-family:var(--font-d); font-weight:700; font-size:1.05rem; padding:.9rem 1rem; border-radius:14px; margin-top:auto}
.checkbtn:disabled{opacity:.4; cursor:default}
.checkbtn.secondary{background:var(--surface2); color:var(--ink)}

/* teach card */
.teach{background:var(--surface); border:1px solid var(--line); border-radius:20px; padding:1.4rem 1.2rem; display:flex; flex-direction:column; gap:.55rem; align-items:flex-start}
.teach .newtag{font-size:.7rem; font-weight:800; letter-spacing:.14em; text-transform:uppercase; background:var(--accent-soft); color:var(--accent-deep); border-radius:999px; padding:.2rem .6rem}
.teach .en{font-size:1rem; font-weight:600; color:var(--ink2)}
.teach .rom{font-family:var(--font-w); font-size:1.7rem; font-weight:700; line-height:1.25}
.teach .th{font-family:var(--font-th); font-size:1.35rem; color:var(--accent-deep)}
.teach .note{font-size:.85rem; color:var(--ink2); background:var(--surface2); border-radius:10px; padding:.55rem .75rem; margin-top:.3rem}
.tonelegend{font-size:.72rem; color:var(--ink2); margin-top:.4rem; font-family:var(--font-w)}

/* listen mode */
.unitrow .thglyph svg{width:24px; height:24px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; vertical-align:middle}
.lsnrow{display:flex; gap:1.1rem; align-items:center; justify-content:center; margin:.6rem 0}
.ppbtn{width:4.4rem; height:4.4rem; border-radius:999px; background:var(--accent); color:var(--accent-ink); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow)}
.ppbtn svg{width:30px; height:30px; fill:currentColor}
.skipbtn{width:3.1rem; height:3.1rem; border-radius:999px; background:var(--surface2); color:var(--ink2); display:flex; align-items:center; justify-content:center}
.skipbtn svg{width:20px; height:20px; fill:currentColor}
.lsncount{text-align:center; font-size:.82rem; font-weight:700; color:var(--ink2); font-variant-numeric:tabular-nums}

/* audio-pick exercise */
.audioopt{display:flex; align-items:center; gap:.65rem; font-weight:700; color:var(--ink2)}
.audioopt svg{width:18px; height:18px; fill:currentColor; flex-shrink:0}
.audioopt.sel{border-color:var(--accent); color:var(--ink); background:var(--accent-soft)}
.optletter{font-family:var(--font-d); font-weight:800; font-size:.9rem; background:var(--surface2); border-radius:8px; width:1.9rem; height:1.9rem; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0}
.audioopt.sel .optletter{background:var(--accent); color:var(--accent-ink)}
.audioopt .rev{font-family:var(--font-w); font-weight:600}

/* star (frequent review) */
.starchip{font-size:.85rem; font-weight:700; border-radius:999px; padding:.45rem .95rem; background:var(--surface2); color:var(--ink2)}
.starchip.on{background:var(--accent-soft); color:var(--accent-deep)}
.pbrow .pbstar{color:var(--accent); margin-right:.15rem}

/* unscramble */
.buildrow{min-height:3.2rem; display:flex; flex-wrap:wrap; gap:.45rem; border-bottom:2px solid var(--line); padding-bottom:.6rem}
.bank{display:flex; flex-wrap:wrap; gap:.45rem}
.chiptok{font-family:var(--font-w); font-weight:600; font-size:1rem; background:var(--surface); border:1.5px solid var(--line); border-radius:10px; padding:.45rem .7rem}
.chiptok.used{opacity:.25; pointer-events:none}
.buildrow .chiptok{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-deep)}

/* dialogue */
.bubbles{display:flex; flex-direction:column; gap:.7rem}
.bubble{max-width:88%; border-radius:16px; padding:.7rem .95rem; font-size:.95rem}
.bubble.npc{background:var(--surface); border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:4px}
.bubble.me{background:var(--accent-soft); color:var(--accent-deep); align-self:flex-end; border-bottom-right-radius:4px}
.bubble .bth{font-family:var(--font-th); font-size:1.05rem}
.bubble .brom{font-family:var(--font-w); font-weight:600}
.bubble .ben{font-size:.78rem; color:var(--ink2); margin-top:.15rem}
.bubble.me .ben{color:var(--accent-deep); opacity:.75}
.speaker{font-size:.72rem; font-weight:700; color:var(--ink2); margin-bottom:-.4rem}

/* phrasebook */
.searchrow input{border-radius:999px; padding:.6rem 1.1rem}
.pbunit{font-family:var(--font-d); font-weight:700; font-size:1rem; margin:.6rem 0 .2rem}
.pbrow{display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; padding:.6rem .2rem; border-bottom:1px solid var(--line)}
.pbrow .pben{font-weight:600; font-size:.92rem}
.pbrow .pbrom{font-family:var(--font-w); font-size:.85rem; color:var(--ink2)}
.pbrow .lvl{margin-left:auto; flex-shrink:0; width:8px; height:8px; border-radius:99px; background:var(--line)}
.pbrow .lvl.l1{background:var(--accent)} .pbrow .lvl.l2{background:var(--good)}

/* modal */
.overlay{position:fixed; inset:0; background:rgba(10,14,12,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{background:var(--bg); width:100%; max-width:30rem; border-radius:22px 22px 0 0; padding:1.2rem 1.2rem 2rem; max-height:85vh; overflow-y:auto}
.sheet .handle{width:38px; height:4px; border-radius:99px; background:var(--line); margin:0 auto .9rem}

/* settings */
.setrow{display:flex; flex-direction:column; gap:.35rem}
.setrow label{font-size:.82rem; font-weight:700; color:var(--ink2)}
.btnrow{display:flex; gap:.6rem}
.smallbtn{background:var(--surface2); font-weight:700; font-size:.88rem; border-radius:12px; padding:.6rem 1rem}
.smallbtn.warn{color:var(--bad)}
.notice{font-size:.82rem; color:var(--ink2)}
.ttsbanner{background:var(--bad-soft); color:var(--bad); font-size:.85rem; font-weight:600; border-radius:12px; padding:.7rem .9rem}

/* stats + finish */
.statgrid{display:grid; grid-template-columns:1fr 1fr; gap:.7rem}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:.8rem .95rem}
.stat .n{font-family:var(--font-d); font-size:1.6rem; font-weight:800; font-variant-numeric:tabular-nums}
.stat .l{font-size:.75rem; font-weight:700; color:var(--ink2); text-transform:uppercase; letter-spacing:.1em}
.finish{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.6rem; text-align:center}
.finish .bigth{font-family:var(--font-th); font-size:3rem; color:var(--accent)}
.finish h2{font-size:1.5rem}
.finish p{color:var(--ink2); margin:0}

@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

/* ---------- state ---------- */
const KEY="sawatdee-v1";
const INTERVALS=[0,1,2,4,7,14,30,60];
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(s,n){const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysBetween(a,b){return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5);}
let S=null;
function defaultState(){return {name:"",trip:"2027-04-25",start:todayStr(),streak:0,best:0,last:"",sessions:0,newPer:4,placed:false,welcomed:false,dlg:[],ph:{}};}
function load(){try{const r=localStorage.getItem(KEY);S=r?Object.assign(defaultState(),JSON.parse(r)):defaultState();}catch(e){S=defaultState();}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function P(id){if(!S.ph[id])S.ph[id]={lv:0,due:todayStr(),intro:false};return S.ph[id];}
function introCount(u){let c=0;PHRASES.forEach(p=>{if((u===undefined||p.u===u)&&S.ph[p.id]&&S.ph[p.id].intro)c++;});return c;}
function unitTotal(u){return RAW[u].length;}
function dueIds(){const t=todayStr();return PHRASES.filter(p=>S.ph[p.id]&&S.ph[p.id].intro&&S.ph[p.id].due<=t).map(p=>p.id);}
function activeUnit(){for(let u=0;u<UNITS.length;u++){if(introCount(u)<unitTotal(u))return u;}return UNITS.length-1;}
function dlgUnlocked(u){return introCount(u)>=Math.ceil(unitTotal(u)*0.8);}

/* ---------- tts ---------- */
let thaiVoice=null,voicesTried=false;
function findVoice(){const vs=speechSynthesis.getVoices();thaiVoice=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("th"))||null;voicesTried=vs.length>0;}
if("speechSynthesis"in window){findVoice();speechSynthesis.onvoiceschanged=()=>{findVoice();};}
function speak(th,slow){if(!("speechSynthesis"in window))return;const txt=th.replace(/\.{3}|…/g,"").trim();if(!txt)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang="th-TH";if(thaiVoice)u.voice=thaiVoice;u.rate=slow?0.55:0.9;speechSynthesis.speak(u);}

/* ---------- helpers ---------- */
const app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function distractors(id,n){const me=PHRASES[id];const same=shuffle(PHRASES.filter(p=>p.id!==id&&p.u===me.u));const rest=shuffle(PHRASES.filter(p=>p.id!==id&&p.u!==me.u));return same.concat(rest).slice(0,n);}
const ICO={play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
book:'<svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h14v18H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 1 2-2h14"/></svg>',
gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M18.5 5.5l-1.8 1.8M7.3 16.7l-1.8 1.8"/></svg>',
pauseI:'<svg viewBox="0 0 24 24"><path d="M7 4h4v16H7zM13 4h4v16h-4z"/></svg>',
skipI:'<svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8zM17 4h3v16h-3z"/></svg>',
phones:'<svg viewBox="0 0 24 24"><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>'};
const TONE='<span class="tonelegend">tones: a mid &nbsp;·&nbsp; à low &nbsp;·&nbsp; â falling &nbsp;·&nbsp; á high &nbsp;·&nbsp; ǎ rising</span>';
function isStar(id){return !!(S.ph[id]&&S.ph[id].star);}
function starChip(id){const on=isStar(id);return '<button class="starchip'+(on?" on":"")+'" data-star="'+id+'">'+(on?"★ In frequent review":"☆ Review often")+'</button>';}
function wireStars(root){root.querySelectorAll("[data-star]").forEach(b=>b.addEventListener("click",e=>{e.stopPropagation();const id=+b.dataset.star;const st=P(id);st.star=!st.star;if(st.star&&st.due>addDays(todayStr(),2))st.due=addDays(todayStr(),2);save();b.classList.toggle("on",st.star);b.textContent=st.star?"★ In frequent review":"☆ Review often";}));}
function audioBtns(th,big){return '<div class="audiobtns"><button class="audiobtn'+(big?' big':'')+'" data-say="'+esc(th)+'">'+ICO.play+'Listen</button><button class="audiobtn'+(big?' big':'')+'" data-say="'+esc(th)+'" data-slow="1">'+ICO.play+'Slow</button></div>';}
function wireAudio(root){root.querySelectorAll("[data-say]").forEach(b=>b.addEventListener("click",()=>speak(b.dataset.say,b.dataset.slow==="1")));}
function navBar(cur){return '<nav class="nav"><div class="inner">'+[["home","Home",ICO.home],["book","Phrasebook",ICO.book],["gear","Settings",ICO.gear]].map(x=>'<button data-nav="'+x[0]+'" class="'+(cur===x[0]?"on":"")+'">'+x[2]+x[1]+'</button>').join("")+'</div></nav>';}
function wireNav(){app.querySelectorAll("[data-nav]").forEach(b=>b.addEventListener("click",()=>{const v=b.dataset.nav;if(v==="home")renderHome();else if(v==="book")renderBook();else renderSettings();}));}
function ttsBanner(){return(voicesTried&&!thaiVoice)?'<div class="ttsbanner">No Thai voice found on this device. On Android: Settings → General management → Text-to-speech → install Thai in Google Speech services. Audio buttons will stay quiet until then.</div>':"";}

/* ---------- home ---------- */
function renderHome(){
const total=PHRASES.length,learned=introCount();
const today=todayStr(),days=daysBetween(today,S.trip);
const due=dueIds().length;
const au=activeUnit();
const tripDays=Math.max(1,daysBetween(S.start,S.trip));
const elapsed=Math.min(tripDays,Math.max(0,daysBetween(S.start,today)));
const expected=Math.round(total*elapsed/tripDays);
const onPace=learned>=expected*0.75||elapsed<7;
const newLeft=unitTotal(au)-introCount(au);
const hello=S.name?("Sawatdee, "+esc(S.name)):"Sawatdee";
app.innerHTML='<div class="view">'
+'<div class="topbar"><div class="brand"><span class="th">สวัสดี</span>Sawatdee</div><div class="streakchip'+(S.streak>0?" hot":"")+'">'+S.streak+'-day streak</div></div>'
+ttsBanner()
+'<div class="hero"><span class="mark">ส</span><div class="kicker">'+hello+'</div>'
+'<h1>'+(days>0?days+" days to Thailand":"You're there! เที่ยวให้สนุก!")+'</h1>'
+'<div class="sub">'+(due>0?due+" phrases due for review":"Nothing due — nice and current")+(newLeft>0?" · new: "+UNITS[au].n:"")+'</div>'
+'<button class="bigbtn" id="startbtn">Start today’s session</button>'
+'<div class="counts"><span>'+learned+' / '+total+' phrases learned</span><span>'+S.sessions+' sessions</span></div></div>'
+'<button class="unitrow" id="lsnbtn"><span class="thglyph">'+ICO.phones+'</span><span class="uinfo"><span class="uname">Listen mode</span><br><span class="usub">Hands-free audio of your learned phrases — English, then the Thai twice</span></span><span class="uprog">'+learned+'</span></button>'
+'<div class="card"><div class="progressbar"><i style="width:'+Math.round(100*learned/total)+'%"></i></div>'
+'<div class="pacenote">'+(onPace?'<b>On pace</b> for the trip':'<b class="behind">A little behind</b> — pace target is '+expected)+' · '+learned+' learned, target '+expected+' by today</div></div>'
+'<div class="sectionlabel">Units</div>'
+UNITS.map((u,i)=>{const ic=introCount(i),tot=unitTotal(i);const unlocked=dlgUnlocked(i);const done=S.dlg.includes(i);
return '<button class="unitrow'+(i===au?" active":"")+'" data-unit="'+i+'"><span class="thglyph">'+u.g+'</span><span class="uinfo"><span class="uname">'+esc(u.n)+' <span style="font-family:var(--font-th);color:var(--ink2);font-weight:400">'+u.th+'</span></span><br><span class="usub">'+esc(u.d)+'</span>'+(unlocked?'<br><span class="dlgchip'+(done?" done":"")+'">'+(done?"✓ ":"")+'Dialogue: '+esc(DIALOGUES[i].t)+'</span>':"")+'</span><span class="uprog'+(ic>=tot?" done":"")+'">'+ic+'/'+tot+'</span></button>';}).join("")
+'</div>'+navBar("home");
wireNav();
document.getElementById("startbtn").addEventListener("click",()=>startSession());
document.getElementById("lsnbtn").addEventListener("click",renderListen);
app.querySelectorAll("[data-unit]").forEach(b=>b.addEventListener("click",()=>{const u=+b.dataset.unit;
if(dlgUnlocked(u)&&!S.dlg.includes(u))startDialogue(u);
else if(introCount(u)<unitTotal(u))startSession(u);
else startDialogue(u);}));
}

/* ---------- session ---------- */
let SES=null;
function startSession(forceUnit){
const t=todayStr();
const reviews=shuffle(dueIds()).slice(0,20);
const u=forceUnit!==undefined?forceUnit:activeUnit();
const fresh=PHRASES.filter(p=>p.u===u&&!(S.ph[p.id]&&S.ph[p.id].intro)).slice(0,S.newPer).map(p=>p.id);
if(reviews.length===0&&fresh.length===0){startDialogue(u,true);return;}
const items=[];let ri=0;
fresh.forEach(id=>{items.push({id,teach:1});items.push({id,q:1,fresh:1});for(let k=0;k<3&&ri<reviews.length;k++)items.push({id:reviews[ri++],q:1});});
while(ri<reviews.length)items.push({id:reviews[ri++],q:1});
SES={items,i:0,right:0,wrong:0,redos:[],nNew:fresh.length,nRev:reviews.length};
renderStep();
}
function sessionLen(){return SES.items.length+SES.redos.length;}
function renderStep(){
if(SES.i>=SES.items.length){
  if(SES.redos.length){SES.items=SES.items.concat(SES.redos);SES.redos=[];}
  else{finishSession();return;}
}
const it=SES.items[SES.i];const p=PHRASES[it.id];
const prog=Math.round(100*SES.i/sessionLen());
const top='<div class="sesstop"><button class="x" id="quit" aria-label="Quit session">×</button><div class="progressbar"><i style="width:'+prog+'%"></i></div></div>';
if(it.teach){
  const st=P(it.id);st.intro=true;st.lv=0;st.due=todayStr();save();
  app.innerHTML='<div class="fullview">'+top
  +'<div class="teach"><span class="newtag">New phrase</span><span class="en">'+esc(p.en)+'</span><span class="rom">'+esc(p.rom)+'</span><span class="th">'+esc(p.th)+'</span>'
  +audioBtns(p.th,true)+(p.note?'<div class="note">'+esc(p.note)+'</div>':"")+starChip(it.id)+TONE+'</div>'
  +'<button class="checkbtn" id="cont">Got it</button></div>';
  wireCommon();speak(p.th,false);
  document.getElementById("cont").addEventListener("click",()=>{SES.i++;renderStep();});
  return;
}
renderQuiz(it,p,top);
}
function pickMode(lv,p){
const toks=p.rom.replace(/…|\.{3}/g,"").trim().split(/\s+/).filter(Boolean);
let pool=lv<=1?["en2rom","rom2en"]:lv<=3?["listen2en","en2rom","rom2en","en2audio"]:["listen2rom","listen2en","en2audio","en2audio","en2rom"];
if(!thaiVoice)pool=pool.filter(m=>m!=="listen2en"&&m!=="listen2rom"&&m!=="en2audio");
if(!pool.length)pool=["en2rom","rom2en"];
let m=pool[Math.floor(Math.random()*pool.length)];
if(lv>=3&&toks.length>=4&&Math.random()<0.35)m="unscramble";
return m;
}
function renderQuiz(it,p,top){
const lv=P(it.id).lv;const mode=it.fresh?"en2rom":pickMode(lv,p);
if(mode==="unscramble"){renderUnscramble(it,p,top);return;}
if(mode==="en2audio"){renderAudioPick(it,p,top);return;}
const ds=distractors(it.id,3);const opts=shuffle([p].concat(ds));
let promptHtml="",optHtml="";
if(mode==="en2rom"){promptHtml='<div class="exprompt">How do you say…</div><div class="exq">'+esc(p.en)+'</div>';
  optHtml=opts.map(o=>'<button class="opt" data-ok="'+(o.id===p.id?1:0)+'"><span class="rom">'+esc(o.rom)+'</span><br><span class="sub">'+esc(o.th)+'</span></button>').join("");}
else if(mode==="rom2en"){promptHtml='<div class="exprompt">What does this mean?</div><div class="exq">'+esc(p.rom)+'<br><span class="th" style="font-size:1.1rem;color:var(--ink2)">'+esc(p.th)+'</span></div>'+audioBtns(p.th);
  optHtml=opts.map(o=>'<button class="opt" data-ok="'+(o.id===p.id?1:0)+'"><span class="rom" style="font-family:var(--font-ui)">'+esc(o.en)+'</span></button>').join("");}
else if(mode==="listen2en"){promptHtml='<div class="exprompt">Listen — what does she mean?</div>'+audioBtns(p.th,true);
  optHtml=opts.map(o=>'<button class="opt" data-ok="'+(o.id===p.id?1:0)+'"><span class="rom" style="font-family:var(--font-ui)">'+esc(o.en)+'</span></button>').join("");}
else{promptHtml='<div class="exprompt">Listen — which one did you hear?</div>'+audioBtns(p.th,true);
  optHtml=opts.map(o=>'<button class="opt" data-ok="'+(o.id===p.id?1:0)+'"><span class="rom">'+esc(o.rom)+'</span></button>').join("");}
app.innerHTML='<div class="fullview">'+top+'<div class="exwrap">'+promptHtml+'<div class="opts">'+optHtml+'</div><div id="fb"></div></div><button class="checkbtn" id="cont" disabled>Continue</button></div>';
wireCommon();
if(mode==="listen2en"||mode==="listen2rom")setTimeout(()=>speak(p.th,false),250);
let answered=false;
app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
  if(answered)return;answered=true;
  const ok=b.dataset.ok==="1";
  app.querySelectorAll(".opt").forEach(o=>{o.disabled=true;if(o.dataset.ok==="1")o.classList.add("right");});
  if(!ok)b.classList.add("wrong");
  grade(it,ok);
  document.getElementById("fb").innerHTML=(ok
    ?'<div class="feedback good">ถูกต้อง! Correct — <span class="fbrom">'+esc(p.rom)+'</span></div>'
    :'<div class="feedback bad">Not quite. It’s <span class="fbrom">'+esc(p.rom)+'</span> — '+esc(p.en)+'</div>')
    +'<div style="margin-top:.55rem">'+starChip(p.id)+'</div>';
  wireStars(document.getElementById("fb"));
  speak(p.th,false);
  const c=document.getElementById("cont");c.disabled=false;c.focus();
}));
document.getElementById("cont").addEventListener("click",()=>{SES.i++;renderStep();});
}
function renderAudioPick(it,p,top){
const ds=distractors(it.id,3);const opts=shuffle([p].concat(ds));
app.innerHTML='<div class="fullview">'+top+'<div class="exwrap">'
+'<div class="exprompt">Tap to listen — which one says…</div><div class="exq">'+esc(p.en)+'</div>'
+'<div class="opts">'+opts.map((o,k)=>'<button class="opt audioopt" data-k="'+k+'"><span class="optletter">'+"ABCD"[k]+'</span>'+ICO.play+'<span class="lbl">Listen</span></button>').join("")
+'</div><div id="fb"></div></div><button class="checkbtn" id="cont" disabled>Check</button></div>';
wireCommon();
let sel=-1,answered=false;
const btns=[...app.querySelectorAll(".audioopt")],cont=document.getElementById("cont");
btns.forEach((b,k)=>b.addEventListener("click",()=>{
  speak(opts[k].th,false);
  if(answered)return;
  sel=k;btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");cont.disabled=false;
}));
cont.addEventListener("click",()=>{
  if(!answered){answered=true;
    const ok=opts[sel].id===p.id;
    btns.forEach((b,k)=>{b.classList.remove("sel");
      b.querySelector(".lbl").outerHTML='<span class="rev">'+esc(opts[k].rom)+'</span>';
      if(opts[k].id===p.id)b.classList.add("right");else if(k===sel)b.classList.add("wrong");});
    grade(it,ok);
    document.getElementById("fb").innerHTML=(ok
      ?'<div class="feedback good">ถูกต้อง! That’s the one — <span class="fbrom">'+esc(p.rom)+'</span></div>'
      :'<div class="feedback bad">Not that one. It was <span class="fbrom">'+esc(p.rom)+'</span> — tap them to compare</div>')
      +'<div style="margin-top:.55rem">'+starChip(p.id)+'</div>';
    wireStars(document.getElementById("fb"));
    speak(p.th,false);cont.textContent="Continue";
  }else{SES.i++;renderStep();}
});
}
function renderUnscramble(it,p,top){
const toks=p.rom.replace(/…|\.{3}/g,"").trim().split(/\s+/).filter(Boolean);
const bank=shuffle(toks.map((t,i)=>({t,i})));
let built=[];
app.innerHTML='<div class="fullview">'+top+'<div class="exwrap"><div class="exprompt">Build the phrase</div><div class="exq">'+esc(p.en)+'</div>'
+audioBtns(p.th)+'<div class="buildrow" id="build"></div><div class="bank" id="bank">'
+bank.map((b,k)=>'<button class="chiptok" data-k="'+k+'">'+esc(b.t)+'</button>').join("")
+'</div><div id="fb"></div></div><button class="checkbtn" id="cont" disabled>Check</button></div>';
wireCommon();
const build=document.getElementById("build"),cont=document.getElementById("cont");
function redraw(){build.innerHTML=built.map((k,pos)=>'<button class="chiptok" data-pos="'+pos+'">'+esc(bank[k].t)+'</button>').join("");
  build.querySelectorAll("[data-pos]").forEach(b=>b.addEventListener("click",()=>{const pos=+b.dataset.pos;const k=built.splice(pos,1)[0];document.querySelector('#bank [data-k="'+k+'"]').classList.remove("used");redraw();}));
  cont.disabled=built.length!==toks.length;}
document.querySelectorAll("#bank .chiptok").forEach(b=>b.addEventListener("click",()=>{if(b.classList.contains("used"))return;b.classList.add("used");built.push(+b.dataset.k);redraw();}));
let checked=false;
cont.addEventListener("click",()=>{
  if(!checked){checked=true;
    const ans=built.map(k=>bank[k].i).join(",");const ok=ans===toks.map((_,i)=>i).join(",");
    grade(it,ok);
    document.getElementById("fb").innerHTML=(ok?'<div class="feedback good">ถูกต้อง! Correct!</div>':'<div class="feedback bad">It’s: <span class="fbrom">'+esc(toks.join(" "))+'</span></div>')
    +'<div style="margin-top:.55rem">'+starChip(p.id)+'</div>';
    wireStars(document.getElementById("fb"));
    speak(p.th,false);cont.textContent="Continue";
  }else{SES.i++;renderStep();}
});
}
function grade(it,ok){
const st=P(it.id);
if(!it.redo){
  if(ok){SES.right++;st.lv=Math.min(7,st.lv+1);st.due=addDays(todayStr(),st.star?Math.min(INTERVALS[st.lv],2):INTERVALS[st.lv]);}
  else{SES.wrong++;st.lv=Math.max(0,st.lv-2);st.due=addDays(todayStr(),1);SES.redos.push({id:it.id,q:1,redo:1});}
}else if(!ok){SES.redos.push({id:it.id,q:1,redo:1});}
save();
}
function finishSession(){
const t=todayStr();
if(S.last!==t){S.streak=(S.last===addDays(t,-1))?S.streak+1:1;S.best=Math.max(S.best,S.streak);S.last=t;}
S.sessions++;save();
const acc=SES.right+SES.wrong?Math.round(100*SES.right/(SES.right+SES.wrong)):100;
app.innerHTML='<div class="fullview"><div class="finish"><div class="bigth">เก่งมาก!</div><h2>gèng mâak — well done!</h2>'
+'<p>'+SES.nRev+' reviewed · '+SES.nNew+' new · '+acc+'% right</p>'
+'<div class="statgrid" style="width:100%;max-width:20rem"><div class="stat"><div class="n">'+S.streak+'</div><div class="l">day streak</div></div><div class="stat"><div class="n">'+introCount()+'</div><div class="l">phrases</div></div></div>'
+'</div><button class="checkbtn" id="cont">Back home</button></div>';
document.getElementById("cont").addEventListener("click",renderHome);
}
function wireCommon(){wireAudio(app);wireStars(app);const q=document.getElementById("quit");if(q)q.addEventListener("click",renderHome);}

/* ---------- dialogue ---------- */
function startDialogue(u,fromSession){
const d=DIALOGUES[u];if(!dlgUnlocked(u)){startSession(u);return;}
let i=0,log=[],mistakes=0;
function bubbleNpc(n,hideEn){return '<div class="speaker">Her</div><div class="bubble npc" data-say="'+esc(n[0])+'"><span class="bth">'+esc(n[0])+'</span><br><span class="brom">'+esc(n[1])+'</span>'+(n[2]&&!hideEn?'<div class="ben">'+esc(n[2])+'</div>':"")+'</div>';}
function bubbleMe(o){return '<div class="bubble me"><span class="brom">'+esc(o[0])+'</span><div class="ben">'+esc(o[1])+'</div></div>';}
function step(){
  if(i>=d.steps.length){
    if(!S.dlg.includes(u))S.dlg.push(u);save();
    app.innerHTML='<div class="fullview"><div class="finish"><div class="bigth">จบ!</div><h2>Scene complete</h2><p>'+esc(d.t)+' · '+(mistakes===0?"flawless!":mistakes+" retr"+(mistakes>1?"ies":"y"))+'</p></div><button class="checkbtn" id="cont">Back home</button></div>';
    document.getElementById("cont").addEventListener("click",renderHome);return;
  }
  const st=d.steps[i];
  const isC=st.c===1;
  let html='<div class="fullview"><div class="sesstop"><button class="x" id="quit">×</button><div style="flex:1;font-family:var(--font-d);font-weight:700">'+esc(d.t)+'</div><div class="streakchip">'+(i+1)+'/'+d.steps.length+'</div></div>';
  if(i===0&&log.length===0)html+='<p class="notice">'+esc(d.s)+' Tap any bubble to hear it again.</p>';
  html+='<div class="bubbles">'+log.join("");
  if(st.n)html+=bubbleNpc(st.n,isC&&!st.done);
  html+='</div><div style="margin-top:auto"><div class="exprompt" style="margin-bottom:.5rem">'+esc(st.q)+'</div><div class="opts">';
  const opts=st._sh||(st._sh=shuffle(st.o.map((o,k)=>k)));
  opts.forEach(k=>{const o=st.o[k];const ok=isC?o[1]:o[2];
    html+='<button class="opt" data-k="'+k+'" data-ok="'+ok+'">'+(isC?'<span class="rom" style="font-family:var(--font-ui)">'+esc(o[0])+'</span>':'<span class="rom">'+esc(o[0])+'</span><br><span class="sub" style="font-family:var(--font-ui)">'+esc(o[1])+'</span>')+'</button>';});
  html+='</div><div id="fb"></div></div></div>';
  app.innerHTML=html;wireAudio(app);
  document.getElementById("quit").addEventListener("click",renderHome);
  if(st.n&&!st.played){st.played=1;setTimeout(()=>speak(st.n[0],false),300);}
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>{
    if(b.dataset.ok==="1"){
      b.classList.add("right");
      if(st.n)log.push(bubbleNpc(st.n,false));
      if(!isC){const o=st.o[+b.dataset.k];log.push(bubbleMe(o));const ph=PHRASES.find(p=>p.rom===o[0]);if(ph)speak(ph.th,false);}
      st.done=1;setTimeout(()=>{i++;step();},700);
    }else{mistakes++;b.classList.add("wrong");b.disabled=true;
      document.getElementById("fb").innerHTML='<div class="feedback bad">Hmm — try another.</div>';}
  }));
}
step();
}

/* ---------- listen mode ---------- */
let LSN=null;
function speakOnce(text,lang,rate){return new Promise(res=>{const u=new SpeechSynthesisUtterance(text);u.lang=lang;if(lang==="th-TH"&&thaiVoice)u.voice=thaiVoice;u.rate=rate;u.onend=res;u.onerror=res;speechSynthesis.speak(u);});}
function lsnWait(ms){return new Promise(r=>setTimeout(r,ms));}
function lsnAlive(my){return LSN&&LSN.gen===my&&LSN.playing;}
async function lsnAcquireWake(){try{if(LSN&&navigator.wakeLock)LSN.wake=await navigator.wakeLock.request("screen");}catch(e){}}
function lsnReleaseWake(){try{if(LSN&&LSN.wake){LSN.wake.release();LSN.wake=null;}}catch(e){}}
if(typeof document!=="undefined")document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&LSN&&LSN.playing)lsnAcquireWake();});
function lsnBuild(){LSN.ids=shuffle(PHRASES.filter(p=>S.ph[p.id]&&S.ph[p.id].intro&&(!LSN.starOnly||isStar(p.id))).map(p=>p.id));LSN.i=0;}
async function lsnLoop(){
const my=LSN.gen;
await lsnAcquireWake();
while(lsnAlive(my)){
  if(!LSN.ids.length)break;
  if(LSN.i>=LSN.ids.length){LSN.ids=shuffle(LSN.ids);LSN.i=0;}
  const p=PHRASES[LSN.ids[LSN.i]];
  const np=document.getElementById("np"),lc=document.getElementById("lc");
  if(!np)break;
  np.innerHTML='<span class="newtag">Now playing</span><span class="en">'+esc(p.en)+'</span><span class="rom">'+esc(p.rom)+'</span><span class="th">'+esc(p.th)+'</span>';
  if(lc)lc.textContent=(LSN.i+1)+" / "+LSN.ids.length;
  speechSynthesis.cancel();
  await speakOnce(p.en.replace(/\s*\(.*?\)/g,"").replace(/…|\.{3}/g,""),"en-US",1);
  if(!lsnAlive(my))break; await lsnWait(500);
  const th=p.th.replace(/…|\.{3}/g,"").trim();
  await speakOnce(th,"th-TH",0.85);
  if(!lsnAlive(my))break; await lsnWait(600);
  await speakOnce(th,"th-TH",0.85);
  if(!lsnAlive(my))break; await lsnWait(1100);
  LSN.i++;
}
}
function lsnStop(){if(!LSN)return;LSN.playing=false;LSN.gen++;speechSynthesis.cancel();lsnReleaseWake();}
function renderListen(){
LSN={ids:[],i:0,playing:false,gen:0,starOnly:false,wake:null};
lsnBuild();
const empty=!LSN.ids.length;
app.innerHTML='<div class="fullview"><div class="sesstop"><button class="x" id="quit" aria-label="Exit listen mode">×</button><div style="flex:1;font-family:var(--font-d);font-weight:700">Listen mode</div></div>'
+ttsBanner()
+(empty
? '<div class="finish"><div class="bigth">ฟัง</div><h2>Nothing to play yet</h2><p>Listen mode plays phrases you have already learned — do a session or two first.</p></div>'
: '<div class="teach" id="np" style="min-height:11rem"><span class="newtag">Ready</span><span class="en">English first, then the Thai twice.</span><span class="rom" style="font-size:1.2rem;color:var(--ink2)">Press play, pocket the phone, go lift.</span></div>'
+'<div class="lsncount" id="lc">'+LSN.ids.length+' phrases · shuffled</div>'
+'<div class="lsnrow"><button class="skipbtn" id="lsnstar" aria-label="Toggle starred only" style="font-size:1.1rem;font-weight:800">☆</button>'
+'<button class="ppbtn" id="pp" aria-label="Play">'+ICO.play+'</button>'
+'<button class="skipbtn" id="skip" aria-label="Skip">'+ICO.skipI+'</button></div>'
+'<p class="notice" style="text-align:center">Keeps your screen awake while playing — audio stops if the app is closed.</p>')
+'</div>';
document.getElementById("quit").addEventListener("click",()=>{lsnStop();LSN=null;renderHome();});
if(empty)return;
const pp=document.getElementById("pp");
pp.addEventListener("click",()=>{
  if(LSN.playing){LSN.playing=false;LSN.gen++;speechSynthesis.cancel();lsnReleaseWake();pp.innerHTML=ICO.play;pp.setAttribute("aria-label","Play");}
  else{LSN.playing=true;LSN.gen++;pp.innerHTML=ICO.pauseI;pp.setAttribute("aria-label","Pause");lsnLoop();}
});
document.getElementById("skip").addEventListener("click",()=>{
  LSN.i++;if(LSN.i>=LSN.ids.length)LSN.i=0;
  if(LSN.playing){LSN.gen++;LSN.playing=true;speechSynthesis.cancel();lsnLoop();}
});
document.getElementById("lsnstar").addEventListener("click",function(){
  LSN.starOnly=!LSN.starOnly;this.textContent=LSN.starOnly?"★":"☆";this.style.color=LSN.starOnly?"var(--accent-deep)":"";
  const was=LSN.playing;LSN.gen++;LSN.playing=false;speechSynthesis.cancel();
  lsnBuild();
  const lc=document.getElementById("lc");if(lc)lc.textContent=LSN.ids.length+" phrases · "+(LSN.starOnly?"starred only":"shuffled");
  if(LSN.ids.length&&was){LSN.playing=true;LSN.gen++;lsnLoop();}
});
}

/* ---------- placement ---------- */
function startPlacement(){
const ids=PHRASES.filter(p=>p.p&&!(S.ph[p.id]&&S.ph[p.id].intro)).map(p=>p.id);
let i=0,knew=0;
function step(){
  if(i>=ids.length){S.placed=true;save();
    app.innerHTML='<div class="fullview"><div class="finish"><div class="bigth">ดีมาก!</div><h2>'+knew+' phrases still with you</h2><p>They’re seeded deep into your review schedule — the app will focus on what’s actually new.</p></div><button class="checkbtn" id="cont">Let’s begin</button></div>';
    document.getElementById("cont").addEventListener("click",renderHome);return;}
  const p=PHRASES[ids[i]];
  app.innerHTML='<div class="fullview"><div class="sesstop"><button class="x" id="quit">×</button><div class="progressbar"><i style="width:'+Math.round(100*i/ids.length)+'%"></i></div></div>'
  +'<div class="exprompt">Memory check '+(i+1)+' of '+ids.length+' — does this ring a bell?</div>'
  +'<div class="teach"><span class="rom">'+esc(p.rom)+'</span><span class="th">'+esc(p.th)+'</span>'+audioBtns(p.th,true)
  +'<div id="reveal" style="display:none"><span class="en" style="font-size:1.15rem;font-weight:700;color:var(--ink)">'+esc(p.en)+'</span>'+(p.note?'<div class="note">'+esc(p.note)+'</div>':"")+'</div></div>'
  +'<div id="btns" style="margin-top:auto"><button class="checkbtn" id="show">Show meaning</button></div></div>';
  wireAudio(app);speak(p.th,false);
  document.getElementById("quit").addEventListener("click",()=>{S.placed=true;save();renderHome();});
  document.getElementById("show").addEventListener("click",()=>{
    document.getElementById("reveal").style.display="block";
    document.getElementById("btns").innerHTML='<div class="btnrow"><button class="checkbtn secondary" id="no" style="margin-top:0">Not yet</button><button class="checkbtn" id="yes" style="margin-top:0">I knew it</button></div>';
    document.getElementById("yes").addEventListener("click",()=>{const st=P(p.id);st.intro=true;st.lv=3;st.due=addDays(todayStr(),4);knew++;save();i++;step();});
    document.getElementById("no").addEventListener("click",()=>{i++;step();});
  });
}
step();
}

/* ---------- phrasebook ---------- */
function renderBook(filter){
filter=(filter||"").toLowerCase();
let rows="";
function rowHtml(p){const st=S.ph[p.id];const cls=st&&st.intro?(st.lv>=4?"l2":"l1"):"";
  return '<button class="pbrow" data-id="'+p.id+'"><span><span class="pben">'+(isStar(p.id)?'<span class="pbstar">★</span>':"")+esc(p.en)+'</span><br><span class="pbrom">'+esc(p.rom)+'</span></span><span class="lvl '+cls+'"></span></button>';}
const starred=PHRASES.filter(p=>isStar(p.id)&&(!filter||p.en.toLowerCase().includes(filter)||p.rom.toLowerCase().includes(filter)));
if(starred.length)rows+='<div class="pbunit" style="color:var(--accent-deep)">★ Frequent review</div>'+starred.map(rowHtml).join("");
UNITS.forEach((u,ui)=>{
  const ps=PHRASES.filter(p=>p.u===ui&&(!filter||p.en.toLowerCase().includes(filter)||p.rom.toLowerCase().includes(filter)));
  if(!ps.length)return;
  rows+='<div class="pbunit">'+u.g+' '+esc(u.n)+'</div>'+ps.map(rowHtml).join("");
});
app.innerHTML='<div class="view"><div class="topbar"><div class="brand"><span class="th">สวัสดี</span>Phrasebook</div></div>'
+'<div class="searchrow"><input id="q" type="search" placeholder="Search English or Thai sounds…" value="'+esc(filter)+'"></div>'
+(rows||'<p class="notice">No matches.</p>')+'</div>'+navBar("book");
wireNav();
const q=document.getElementById("q");
q.addEventListener("input",()=>{const v=q.value;clearTimeout(q._t);q._t=setTimeout(()=>{renderBook(v);const nq=document.getElementById("q");nq.focus();nq.setSelectionRange(nq.value.length,nq.value.length);},250);});
app.querySelectorAll("[data-id]").forEach(b=>b.addEventListener("click",()=>showPhrase(+b.dataset.id,()=>renderBook(filter))));
}
function showPhrase(id,back){
const p=PHRASES[id];
const ov=document.createElement("div");ov.className="overlay";
ov.innerHTML='<div class="sheet"><div class="handle"></div><div class="teach" style="border:none;padding:0;background:none"><span class="en">'+esc(p.en)+'</span><span class="rom">'+esc(p.rom)+'</span><span class="th">'+esc(p.th)+'</span>'+audioBtns(p.th,true)+(p.note?'<div class="note">'+esc(p.note)+'</div>':"")+starChip(p.id)+TONE+'</div></div>';
document.body.appendChild(ov);wireAudio(ov);wireStars(ov);speak(p.th,false);
ov.addEventListener("click",e=>{if(e.target===ov){ov.remove();if(back)back();}});
}

app.innerHTML='<div class="view"><div class="topbar"><div class="brand"><span class="th">สวัสดี</span>Settings</div></div>'
+ttsBanner()
+'<div class="card setrow"><label for="nm">Your name</label><input id="nm" value="'+esc(S.name)+'">'

const bk=document.getElementById("bk");bk.value=JSON.stringify(S);
document.getElementById("saveset").addEventListener("click",()=>{S.name=document.getElementById("nm").value.trim();const td=document.getElementById("td").value;if(td)S.trip=td;S.newPer=+document.getElementById("np").value;save();renderHome();});
document.getElementById("testv").addEventListener("click",()=>speak("สวัสดีค่ะ ยินดีต้อนรับ",false));
const pl=document.getElementById("place");if(pl)pl.addEventListener("click",startPlacement);
document.getElementById("copy").addEventListener("click",function(){bk.select();try{navigator.clipboard.writeText(bk.value).then(()=>{this.textContent="Copied!";});}catch(e){document.execCommand("copy");this.textContent="Copied!";}}.bind(document.getElementById("copy")));
document.getElementById("restore").addEventListener("click",()=>{try{const v=JSON.parse(bk.value);if(v&&v.ph){S=Object.assign(defaultState(),v);save();renderHome();}else alert("That doesn’t look like a Sawatdee backup.");}catch(e){alert("Couldn’t read that backup text.");}});
document.getElementById("reset").addEventListener("click",()=>{if(confirm("Erase ALL progress? This can’t be undone.")){S=defaultState();S.welcomed=true;save();renderHome();}});
}
